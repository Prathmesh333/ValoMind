[project]
name = "valomind"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic-settings>=2.8,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.15,<2",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["apps/api/tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["I001", "F401"]
